<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Blog" }} | Hilario Fernandes</title>
    <link rel="stylesheet" href="{{ '/assets/css/fontawesome-all.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="{{ '/blog/' | relative_url }}" class="brand">
                <span>Hilario Fernandes</span>
                <span class="brand-badge">Blog</span>
            </a>
            <nav>
                <ul class="site-nav">
                    <li><a href="{{ '/' | relative_url }}"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="{{ '/#portfolio' | relative_url }}"><i class="fas fa-th"></i> Portfolio</a></li>
                    <li><a href="https://github.com/HilarioFernandes" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i> GitHub</a></li>
                    <li><a href="https://www.linkedin.com/in/hilario-fernandes-0a1412191/" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin"></i> LinkedIn</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-wrapper">
        <main class="content-card">
            {{ content }}
        </main>
    </div>

    <footer class="site-footer">
        <p>&copy; {{ site.time | date: "%Y" }} Hilario Fernandes &middot; <a href="{{ '/' | relative_url }}">Home</a> &middot; <a href="{{ '/blog/' | relative_url }}">Blog</a> &middot; <a href="https://github.com/HilarioFernandes" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>
</body>
</html>
